<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0a">
  <title>LearningSpace Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="icon-button sidebar-toggle-fixed" id="sidebar-toggle" type="button" aria-label="Hide sidebar" aria-expanded="true" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path d="M9 4v16"></path>
    </svg>
  </button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#chat" data-view="chat" aria-label="LearningSpace home">
        <span class="brand-mark">LS</span>
        <span>
          <strong>LearningSpace</strong>
          <small>Study workspace</small>
        </span>
      </a>

      <button class="new-chat" type="button" id="new-chat-top">
        <span class="plus-mark" aria-hidden="true">+</span>
        New chat
      </button>

      <nav class="nav" aria-label="Workspace sections">
        <button type="button" data-view="chat" class="nav-item is-active">Chat</button>
        <button type="button" data-view="workspace" class="nav-item">Workspace</button>
        <button type="button" data-view="assignment" class="nav-item">Assignment guide</button>
        <button type="button" data-view="study" class="nav-item">Study guide</button>
        <button type="button" data-view="flashcards" class="nav-item">Flashcards</button>
      </nav>

      <section class="history-block" aria-labelledby="history-title">
        <div class="history-head">
          <h2 id="history-title">Recents</h2>
          <button class="history-clear" type="button" id="clear-history">Clear</button>
        </div>
        <div class="chat-history" id="chat-history"></div>
      </section>

      <div class="sidebar-bottom">
        <button class="sidebar-action" type="button" id="settings">Settings</button>
      </div>
    </aside>

    <main class="main">

      <section class="content" id="content" aria-live="polite">
        <div class="loading">Loading workspace…</div>
      </section>
    </main>
  </div>

  <div class="settings-modal" id="settings-modal" hidden>
    <div class="settings-backdrop" data-close-settings></div>
    <aside class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <div>
          <p class="eyebrow">Workspace</p>
          <h2 id="settings-title">Appearance</h2>
          <p>Choose a theme for the dashboard. Your choice is saved in this browser.</p>
        </div>
        <button type="button" class="button small ghost" data-close-settings>Close</button>
      </div>
      <div class="theme-grid" id="theme-grid"></div>
      <p class="settings-note">Themes are based on the OpenCode theme set. The LearningSpace theme keeps the custom workspace palette.</p>
    </aside>
  </div>

  <div class="chat-menu" id="chat-menu" hidden>
    <button type="button" id="chat-menu-delete">Delete</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
